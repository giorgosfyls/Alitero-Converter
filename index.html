<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alitero.org — All-in-one online converter &amp; media suite</title>
  <meta name="description" content="Free online tools to convert images, documents, audio, video and more. Files are processed on your own device.">

  <!-- Font: Inter (the site falls back to the system font if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Applies the saved light/dark theme BEFORE the page paints (no white flash) -->
  <script src="assets/js/core/theme-init.js"></script>

  <!-- Styles: one file per job -->
  <link rel="stylesheet" href="assets/css/base.css">        <!-- colours, reset, typography -->
  <link rel="stylesheet" href="assets/css/layout.css">      <!-- header, menus, footer, search window -->
  <link rel="stylesheet" href="assets/css/components.css">  <!-- buttons, cards, forms, toasts -->
  <link rel="stylesheet" href="assets/css/home.css">        <!-- this page: hero, tabs, tool grid -->
</head>
<body data-page="home">

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header with the announcement bar is generated by assets/js/core/layout.js -->
  <div id="site-header"></div>

  <main id="main">

    <!-- =========================================================
         HERO
         Headline, search box and quick links to the tools that
         already work (the quick links are filled in by home.js).
         ========================================================= -->
    <section class="hero">
      <div class="container hero-inner">

        <span class="hero-badge"><span data-icon="zap"></span> 100% client-side processing • Safe &amp; free</span>

        <h1 class="hero-title">All your conversion tools <br class="hide-mobile">in <span class="wavy">one place</span>.</h1>

        <p class="hero-lead">
          Convert images, documents, video, audio and developer files in seconds,
          with nothing to install. Your files never leave your device.
        </p>

        <!-- Search: filters the tool grid below as you type -->
        <form class="hero-search" id="hero-search" role="search">
          <span class="hero-search-icon" data-icon="search"></span>
          <input type="search" id="home-search" class="hero-search-input" placeholder="Looking for a tool? (e.g. PNG, compress, MP4 to MP3)" autocomplete="off" aria-label="Search tools">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <div class="chips" id="available-chips"></div>
      </div>
    </section>

    <!-- =========================================================
         TOOLS
         Category tabs and the tool grid. Both are generated from
         assets/js/core/tools-data.js
         ========================================================= -->
    <section class="tools-section" id="tools">
      <div class="container">

        <div class="tabs" id="category-tabs" role="group" aria-label="Filter tools by category"></div>

        <div class="tools-meta">
          <p class="result-count" id="result-count" aria-live="polite"></p>
          <button type="button" class="btn-link" id="clear-filters" data-clear-filters hidden>Clear filters</button>
        </div>

        <div class="tools-grid" id="tools-grid"></div>

        <!-- Shown when nothing matches the search -->
        <div class="no-results" id="no-results" hidden>
          <span class="no-results-icon" data-icon="search"></span>
          <h2>No tools found</h2>
          <p>Try a different search, or clear the filters.</p>
          <button type="button" class="btn btn-secondary" data-clear-filters>Clear filters</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is generated by assets/js/core/layout.js -->
  <div id="site-footer"></div>

  <!-- Scripts (order matters: each file uses the ones above it) -->
  <script src="assets/js/core/utils.js"></script>          <!-- creates the Alitero namespace, toast, storage -->
  <script src="assets/js/core/tools-data.js"></script>     <!-- the list of tools -->
  <script src="assets/js/core/icons.js"></script>          <!-- SVG icons -->
  <script src="assets/js/core/layout.js"></script>         <!-- header, footer, search window -->
  <script src="assets/js/core/theme.js"></script>          <!-- light / dark button -->
  <script src="assets/js/core/nav.js"></script>            <!-- dropdowns + mobile menu -->
  <script src="assets/js/core/search-modal.js"></script>   <!-- Ctrl/⌘ + K search -->
  <script src="assets/js/pages/home.js"></script>          <!-- this page -->
</body>
</html>
